name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
          POSTGRES_DB: ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          working-directory: backend
      - name: Test
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          S3_BUCKET: ci
          JWT_PRIVATE_KEY_PEM: ""
          JWT_PUBLIC_KEY_PEM: ""
          TOTP_ENC_KEY_HEX: "000102030405060708090a0b0c0d0e0f000102030405060708090a0b0c0d0e0f"
        working-directory: backend
        run: go test ./... -race -count=1 -coverprofile=cov.out
      - name: SARIF scan (gosec)
        uses: securego/gosec@master
        with:
          args: '-fmt sarif -out gosec.sarif backend/...'
      - name: Upload gosec SARIF
        # GitHub Code Scanning requires GHAS on private repos. Skip the upload
        # there (the scan still runs; failures are visible in logs); on public
        # repos / GHAS this populates the Security tab.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif

  admin-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: admin-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: admin-web/package.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.x', channel: 'stable' }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  images:
    needs: [backend, admin-web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kalki-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Retention image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.retention
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kalki-retention:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Admin web image
        uses: docker/build-push-action@v6
        with:
          context: admin-web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kalki-admin-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
