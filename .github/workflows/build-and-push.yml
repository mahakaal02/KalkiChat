name: Build & push container images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "admin-web/**"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated subset to build (blank on push = auto-detect from changed paths; blank on manual = all three)"
        required: false
        default: ""

concurrency:
  group: build-push-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-flight prod build

jobs:
  # Detect which service trees changed in this push. Outputs one boolean per
  # service so the matrix can gate itself without rebuilding everything when
  # only a single app touched. `retention` is gated on backend/** because
  # the retention image is built from the same dir with a different
  # Dockerfile (backend/Dockerfile.retention).
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin-web: ${{ steps.filter.outputs.admin-web }}
      retention: ${{ steps.filter.outputs.retention }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            admin-web:
              - 'admin-web/**'
            retention:
              - 'backend/**'

  build:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Backend — Go HTTP/WS API. No NEXT_PUBLIC_* / VITE_* to inline;
          # server-only.
          - service: backend
            image: schat-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            changed: ${{ needs.detect.outputs.backend }}
            build_args: ""

          # Admin web — Next.js. NEXT_PUBLIC_API_BASE is baked at build
          # time. Default points at the public Traefik-fronted backend URL;
          # override per cluster by re-running the workflow with a different
          # build arg (or by patching the chart's
          # admin-web env at runtime, which the Next.js code already supports
          # for /api/proxy/[...] server-component fetches).
          - service: admin-web
            image: schat-admin-web
            context: ./admin-web
            dockerfile: ./admin-web/Dockerfile
            changed: ${{ needs.detect.outputs.admin-web }}
            build_args: |
              NEXT_PUBLIC_API_BASE=https://schat-backend.cloud.podstack.ai

          # Retention — background sweeper from the same Go module, built
          # via backend/Dockerfile.retention. Path-filtered on backend/**
          # so a fix in shared backend code triggers a rebuild of both
          # images.
          - service: retention
            image: schat-retention
            context: ./backend
            dockerfile: ./backend/Dockerfile.retention
            changed: ${{ needs.detect.outputs.retention }}
            build_args: ""

    steps:
      # Resolve "should this matrix leg run?" per event + input:
      #   - workflow_dispatch with explicit services input → respect the list
      #   - workflow_dispatch with blank input → run all three
      #   - push → only run if the service's tree changed (from detect job)
      - name: Gate
        id: gate
        run: |
          input="${{ github.event.inputs.services }}"
          event="${{ github.event_name }}"
          changed="${{ matrix.changed }}"
          svc="${{ matrix.service }}"

          if [ "$event" = "workflow_dispatch" ]; then
            if [ -n "$input" ]; then
              if [[ ",${input}," == *",${svc},"* ]]; then
                echo "selected=true"  >> "$GITHUB_OUTPUT"
              else
                echo "selected=false" >> "$GITHUB_OUTPUT"
                echo "::notice::skipping ${svc} (not in dispatch input: ${input})"
              fi
            else
              # blank input on manual run = build all three
              echo "selected=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # push event — only build if files in this service tree changed
            if [ "$changed" = "true" ]; then
              echo "selected=true" >> "$GITHUB_OUTPUT"
            else
              echo "selected=false" >> "$GITHUB_OUTPUT"
              echo "::notice::skipping ${svc} (no path changes)"
            fi
          fi

      - name: Checkout
        if: steps.gate.outputs.selected == 'true'
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: steps.gate.outputs.selected == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.gate.outputs.selected == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.gate.outputs.selected == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag: UTC YYYYMMDDTHHMMSSZ + 7-char SHA. Matches /bet's format so
      # the ImagePolicy regex stays identical across both stacks. Timestamp
      # sorts lexicographically; SHA traces back to source.
      - name: Compute tag
        if: steps.gate.outputs.selected == 'true'
        id: tag
        run: echo "value=$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.image }}
        if: steps.gate.outputs.selected == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.tag.outputs.value }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
