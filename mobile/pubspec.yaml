name: kalki_chat
description: KalkiChat — secure 1-to-admin messaging.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.4 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State / DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Crypto — Dart libsodium bindings; complemented by FFI for Ed25519/X25519.
  cryptography: ^2.7.0           # AES-GCM, HKDF, X25519, Ed25519 (pure-Dart fallback)
  cryptography_flutter: ^2.3.2   # Hardware-accelerated AES-GCM on Android/iOS
  pointycastle: ^3.9.1           # SHA-512, padding utilities

  # KalkiChat-shared E2E primitives. Same implementation is consumed by the
  # admin companion-device app so the protocol stays in one place.
  kalki_crypto:
    path: ../packages/kalki_crypto

  # Secure storage / DB
  flutter_secure_storage: ^9.2.2
  sqflite_sqlcipher: ^3.1.0+1
  path_provider: ^2.1.4
  path: ^1.9.0

  # Networking
  dio: ^5.7.0
  http_certificate_pinning: ^3.0.1
  web_socket_channel: ^3.0.1

  # Push
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Device security
  safe_device: ^1.2.0              # root / jailbreak / dev-mode detection
  screen_protector: ^1.4.2         # FLAG_SECURE on Android, blur on iOS

  # UI
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  cached_network_image: ^3.4.1

  # Logging
  logger: ^2.4.0

  # Utilities
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates Android mipmap-{m,h,xh,xxh,xxxh}dpi + the iOS AppIcon
  # appiconset from a single source PNG. Run after replacing the icon:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# ──────────────────────────────────────────────────────────────────────────
# Launcher / app-icon source for both Android and iOS.
#
# The source PNG at `image_path` is processed by `flutter_launcher_icons`
# and rewritten into:
#   * android/app/src/main/res/mipmap-{m,h,xh,xxh,xxxh}dpi/ic_launcher.png
#   * ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png
#
# iOS rejects PNGs with an alpha channel — `remove_alpha_ios: true`
# composites the source over a solid background before writing the iOS
# files. The Android side keeps the alpha so circular / squircle masks
# still look right on launchers that apply them.
#
# `min_sdk_android: 21` matches mobile/android/app/build.gradle.kts;
# adaptive-icon variants are not generated (the supplied logo includes
# text near the bottom edge which would get clipped by the adaptive
# mask). If you later want adaptive icons, supply a separate transparent
# foreground PNG via `adaptive_icon_foreground` and a hex background via
# `adaptive_icon_background`.
#
# DO NOT add a parallel block to admin-mobile/pubspec.yaml — the admin
# companion app keeps a distinct icon by design so it can be visually
# differentiated from the user app on shared devices.
# ──────────────────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
