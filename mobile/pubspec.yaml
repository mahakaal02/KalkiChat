name: kalki_chat
description: KalkiChat — secure 1-to-admin messaging.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State / DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Crypto — Dart libsodium bindings; complemented by FFI for Ed25519/X25519.
  cryptography: ^2.7.0           # AES-GCM, HKDF, X25519, Ed25519 (pure-Dart fallback)
  cryptography_flutter: ^2.3.2   # Hardware-accelerated AES-GCM on Android/iOS
  pointycastle: ^3.9.1           # SHA-512, padding utilities

  # Secure storage / DB
  flutter_secure_storage: ^9.2.2
  sqflite_sqlcipher: ^3.1.0+1
  path_provider: ^2.1.4
  path: ^1.9.0

  # Networking
  dio: ^5.7.0
  http_certificate_pinning: ^3.0.1
  web_socket_channel: ^3.0.1

  # Push
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Device security
  flutter_jailbreak_detection: ^1.10.0
  flutter_windowmanager: ^0.2.0   # FLAG_SECURE
  screen_protector: ^1.4.2         # iOS screenshot/recording detection

  # UI
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  cached_network_image: ^3.4.1

  # Logging
  logger: ^2.4.0

  # Utilities
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.7
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
