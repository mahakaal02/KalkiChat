# This is an EXAMPLE manifest. In production, manage secrets via
# external-secrets-operator pointing at AWS Secrets Manager / Vault.
apiVersion: v1
kind: Secret
metadata:
  name: kalki-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgres://user:pass@postgres.kalki.svc/kalki?sslmode=verify-full"
  REDIS_URL:    "rediss://:pass@redis.kalki.svc:6379/0"
  S3_ACCESS_KEY: "REPLACE"
  S3_SECRET_KEY: "REPLACE"
  JWT_PRIVATE_KEY_PEM: |
    -----BEGIN PRIVATE KEY-----
    REPLACE
    -----END PRIVATE KEY-----
  JWT_PUBLIC_KEY_PEM: |
    -----BEGIN PUBLIC KEY-----
    REPLACE
    -----END PUBLIC KEY-----
  TOTP_ENC_KEY_HEX: "REPLACE_64_HEX_CHARS"
