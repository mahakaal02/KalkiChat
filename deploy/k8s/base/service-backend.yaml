apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  # WebSocket sticky routing happens at the ingress layer (consistent-hash on
  # client IP / Authorization header). The Service itself remains ClusterIP.
  type: ClusterIP
---
# Headless service for stable per-pod DNS — useful for the ingress to address
# specific backends when sticky-hashing is required for WS.
apiVersion: v1
kind: Service
metadata:
  name: backend-headless
spec:
  clusterIP: None
  selector: { app: backend }
  ports:
    - port: 8080
      targetPort: 8080
      name: http
