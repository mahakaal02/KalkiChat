apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: admin-web }
  template:
    metadata:
      labels: { app: admin-web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: admin-web
          image: ghcr.io/REPO/kalki-admin-web:replaced-by-ci
          ports: [{ containerPort: 3000 }]
          env:
            - { name: NEXT_PUBLIC_API_BASE, value: "https://api.kalkichat.example" }
            - { name: API_INTERNAL_BASE,    value: "http://backend.kalki.svc:8080" }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /login, port: 3000 }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
