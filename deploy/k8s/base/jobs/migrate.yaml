apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: migrate
          image: ghcr.io/REPO/kalki-backend:replaced-by-ci
          command: ["/server"]
          args: ["--migrate-only"]
          envFrom:
            - configMapRef: { name: kalki-config }
            - secretRef:    { name: kalki-secrets }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
