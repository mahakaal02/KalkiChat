name: kalki_admin
description: KalkiChat Admin (Android).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.4 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  # Chain-walking SPKI cert pinning — see mobile/pubspec.yaml for the
  # full rationale. Replaces http_certificate_pinning.
  schat_cert_pinning:
    path: ../packages/schat_cert_pinning
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Shared KalkiChat E2E primitives — same implementation the user mobile app
  # uses. Phase 2 of the admin-companion-device rollout will start consuming
  # IdentityKeys / Envelope / DoubleRatchet from here.
  kalki_crypto:
    path: ../packages/kalki_crypto
  sqflite_sqlcipher: ^3.1.0+1
  # Replaces flutter_jailbreak_detection (unmaintained, broke on AGP 9) and
  # flutter_windowmanager (same). Mirrors mobile/pubspec.yaml — see PR #2.
  safe_device: ^1.2.0              # root / jailbreak / dev-mode detection
  screen_protector: ^1.4.2         # FLAG_SECURE on Android, blur on iOS
  web_socket_channel: ^3.0.1
  uuid: ^4.5.1
  intl: ^0.19.0
  logger: ^2.4.0
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
