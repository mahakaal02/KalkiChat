version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  http_certificate_pinning: ^3.0.1
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
