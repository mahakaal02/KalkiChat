  flutter_jailbreak_detection: ^1.10.0
  flutter_windowmanager: ^0.2.0
  web_socket_channel: ^3.0.1
  uuid: ^4.5.1
  intl: ^0.19.0
  logger: ^2.4.0
  path_provider: ^2.1.4
