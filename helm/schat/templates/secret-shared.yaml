---
# Cross-service shared Secret. Mounted via `envFrom: secretRef:
# schat-shared` on the backend + retention pods. Anything the backend
# reads via os.Getenv at boot belongs here.
#
# In prod the safe layering is:
#   - this template renders defaults (CHANGE_ME sentinels)
#   - the in-cluster `schat-helm-values` Secret (NOT in git) overrides
#     `sharedSecret.*` values via Flux HelmRelease.valuesFrom — see
#     clusters/schat/helmrelease.yaml and the _bootstrap.yaml runbook.
apiVersion: v1
kind: Secret
metadata:
  name: schat-shared
  labels:
    {{- include "schat.labels" (dict "name" "shared" "ctx" .) | nindent 4 }}
type: Opaque
stringData:
  JWT_PRIVATE_KEY_PEM: {{ .Values.sharedSecret.jwtPrivateKeyPem | quote }}
  JWT_PUBLIC_KEY_PEM: {{ .Values.sharedSecret.jwtPublicKeyPem | quote }}
  TOTP_ENC_KEY_HEX: {{ .Values.sharedSecret.totpEncKeyHex | quote }}
