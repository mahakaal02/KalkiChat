{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: schat-postgres
  labels:
    {{- include "schat.labels" (dict "name" "postgres" "ctx" .) | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: schat-postgres-initdb
  labels:
    {{- include "schat.labels" (dict "name" "postgres" "ctx" .) | nindent 4 }}
data:
  # Postgres' /docker-entrypoint-initdb.d/ scripts run ONCE on a fresh
  # PVC. We render an idempotent `CREATE DATABASE … WHERE NOT EXISTS`
  # for each entry in `.Values.postgres.databases`.
  10-create-databases.sh: |
    #!/usr/bin/env bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -d postgres <<-EOSQL
    {{- range .Values.postgres.databases }}
      SELECT 'CREATE DATABASE "{{ . }}"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='{{ . }}')\gexec
    {{- end }}
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: schat-postgres
  labels:
    {{- include "schat.labels" (dict "name" "postgres" "ctx" .) | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: schat
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: schat-postgres
  labels:
    {{- include "schat.labels" (dict "name" "postgres" "ctx" .) | nindent 4 }}
spec:
  serviceName: schat-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: schat
  template:
    metadata:
      labels:
        {{- include "schat.labels" (dict "name" "postgres" "ctx" .) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "schat.nodeAffinity" . | nindent 6 }}
      # postgres:16-alpine entrypoint expects to start as root and gosu
      # itself down to the postgres user (UID 70). We pin fsGroup so the
      # PVC is owned by that group and the data dir stays read/write
      # after the entrypoint drops privileges. runAsNonRoot at the
      # container level is intentionally omitted — the entrypoint
      # requires root for the initial chown.
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: schat-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready","-U","{{ .Values.postgres.user }}"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready","-U","{{ .Values.postgres.user }}"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: initdb
          configMap:
            name: schat-postgres-initdb
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.storage.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
